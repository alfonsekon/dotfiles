##########
# fading #
##########

fading = false;
fade-delta = 2;
no-fading-openclose = false;

fade-exclude = [ ];

###########
# shadows #
###########

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.55;
shadow-offset-x = -6;
shadow-offset-y = -6;

