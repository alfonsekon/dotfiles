; Make sure to use polybar >= 3.7.0

[colors]
; Gruvbox Dark theme
background = #F7282828
background-alt = #3c3836
foreground = #ebdbb2
; Primary is now Gruvbox Blue (for text/icons)
primary = #83a598
; Secondary is now Gruvbox Yellow (for separators)
secondary = #fabd2f
alert = #fb4934
; Gruvbox Green (Bright)
success = #b8bb26
; Gruvbox Green (Neutral/Darker)
green-alt = #98971a

[bar/main]
; width = 99.20%
; offset-x = 0.40%
; offset-y = 0.25%
height = 27
; picom corner-radius will override this value
; radius = 0.0
fixed-center = true
; override-redirect = true 
wm-restack = i3

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

padding-left = 0
padding-right = 2

# The character to use as a separator
separator = |
# Set to Gruvbox Yellow as requested
separator-foreground = ${colors.secondary}

module-margin-left = 1
module-margin-right = 1

font-0 = JetBrainsMono Nerd Font:size=10

; Reordered to match your i3blocks order (Right to Left)
modules-left = i3
modules-center = date
modules-right = capslock filesystem battery cpu temperature memory pulseaudio player tray

; for polybar < 3.7.0 (3.5.7 for Ubuntu 22.04)
; tray-position = right
; tray-detached = true
; # Move it 20 pixels left and 2 pixels down to keep it away from the corner
; tray-offset-x = -5
; tray-offset-y = 0
; tray-padding = 1

cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline= ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

scroll-up = i3wm-wsnext
scroll-down = i3wm-wsprev

[module/date]
type = internal/date
interval = 1
date = "%d - %H:%M"
label = %date%
label-foreground = ${colors.primary}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = / %free%
label-mounted-foreground = ${colors.primary}

[module/battery]
type = internal/battery
low-at = 20
full-at = 89

battery = BAT0
adapter = AC0

poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <label-low> <animation-low>
label-charging = %percentage%%
label-charging-foreground = ${colors.success}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.secondary}
label-full = Full
label-full-foreground = ${colors.success}
label-low = BATTERY LOW %percentage%%
label-low-foreground = ${colors.alert}

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

; gruvbox red(?) to gruvbox green transition
ramp-capacity-0-foreground = #fb4934
ramp-capacity-1-foreground = #f5a13d
ramp-capacity-2-foreground = #eec94c
ramp-capacity-3-foreground = #d6c73f
ramp-capacity-4-foreground = #b8bb26

; Only applies if <animation-charging> is used
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-0-foreground = ${colors.success}
animation-charging-1-foreground = ${colors.success}
animation-charging-2-foreground = ${colors.success}
animation-charging-3-foreground = ${colors.success}
animation-charging-4-foreground = ${colors.success}
; Framerate in milliseconds
animation-charging-framerate = 750

; Only applies if <animation-discharging> is used
animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
animation-discharging-0-foreground = ${colors.secondary}
animation-discharging-1-foreground = ${colors.secondary}
animation-discharging-2-foreground = ${colors.secondary}
animation-discharging-3-foreground = ${colors.secondary}
animation-discharging-4-foreground = ${colors.secondary}
; Framerate in milliseconds
animation-discharging-framerate = 750

; Only applies if <animation-low> is used
; New in version 3.6.0
animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 300

[module/cpu]
type = internal/cpu
interval = 5
label = %percentage%%
label-foreground = ${colors.primary}

[module/temperature]
type = internal/temperature
interval = 5
thermal_zone = 0
label = %temperature-c%
label-foreground = ${colors.primary}

[module/memory]
type = internal/memory
interval = 8
format = <label> <bar-used>
label = %gb_used%
label-foreground = ${colors.primary}
bar-used-indicator =
bar-used-width = 8
bar-used-foreground-0 = #b8bb26
bar-used-foreground-1 = #c0b73b
bar-used-foreground-2 = #c9b550
bar-used-foreground-3 = #d2b265
bar-used-foreground-4 = #db9f7a
bar-used-foreground-5 = #e68757
bar-used-foreground-6 = #f06b45
bar-used-foreground-7 = #fb4934
bar-used-fill = ▐
bar-used-empty = ▐
bar-used-empty-foreground = #444444

; [module/memory]
; type = internal/memory
; format = <label> <ramp-used>
; label-foreground = ${colors.primary}
; ramp-used-0 = ▁
; ramp-used-1 = ▂
; ramp-used-2 = ▃
; ramp-used-3 = ▄
; ramp-used-4 = ▅
; ramp-used-5 = ▆
; ramp-used-6 = ▇
; ramp-used-7 = █
; ramp-used-0-foreground = #b8bb26
; ramp-used-1-foreground = #9eae2d
; ramp-used-2-foreground = #8c9e34
; ramp-used-3-foreground = #7b9d3b
; ramp-used-4-foreground = #6a8c42
; ramp-used-5-foreground = #597a49
; ramp-used-6-foreground = #48694f
; ramp-used-7-foreground = #d75f5f

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = true

interval = 5
reverse-scroll = false
format-volume = <label-volume>
format-muted = <label-muted>

label-volume =  %percentage%%
label-volume-foreground = ${colors.success}

label-muted =  %percentage%%
label-muted-foreground = #666

; Right and Middle click
click-right = pavucontrol
click-middle = blueman-manager

[module/capslock]
type = internal/xkeyboard
; blacklist-0 = num lock
blacklist-1 = scroll lock

label-layout = 
label-layout-foreground = ${colors.primary}

label-indicator-on-capslock = "CL"
; Using Blue background for the indicator block to match the text theme
label-indicator-on-capslock-foreground = ${colors.background}
label-indicator-on-capslock-background = ${colors.primary}
label-indicator-on-capslock-padding = 1
label-indicator-on-capslock-margin = 0

label-indicator-on-numlock = "NL"
label-indicator-on-numlock-foreground = ${colors.background}
label-indicator-on-numlock-background = ${colors.primary}
label-indicator-on-numlock-padding = 1
label-indicator-on-numlock-margin = 0




; for polybar >= 3.7.0 
[module/tray]
type = internal/tray
tray-spacing = 10px
tray-size = 60%  

[module/player]
type = custom/script
exec = ~/personal/scripts/player.sh
click-left = playerctl play-pause
interval = 1

[settings]
screenchange-reload = true

