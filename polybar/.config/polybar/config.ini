[colors]
; Gruvbox Dark theme
background = #F0282828
background-alt = #3c3836
foreground = #ebdbb2
; Primary is now Gruvbox Blue (for text/icons)
primary = #83a598
; Secondary is now Gruvbox Yellow (for separators)
secondary = #fabd2f
alert = #fb4934
; Gruvbox Green (Bright)
success = #b8bb26
; Gruvbox Green (Neutral/Darker)
green-alt = #98971a

[bar/main]
width = 99.28%
offset-x = 0.36%
offset-y = 0.25%
height = 27
radius = 8.0
fixed-center = true
override-redirect = true 
wm-restack = i3

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

padding-left = 0
padding-right = 2

# The character to use as a separator
separator = |
# Set to Gruvbox Yellow as requested
separator-foreground = ${colors.secondary}

module-margin-left = 1
module-margin-right = 1

font-0 = "JetBrainsMono Nerd Font:pixelsize=10;2"

; Reordered to match your i3blocks order (Right to Left)
modules-left = i3
modules-center = date
modules-right = capslock filesystem battery cpu-temperature memory pulseaudio tray

; for polybar < 3.7.0 (3.5.7 for Ubuntu 22.04)
; tray-position = right
; tray-detached = true
; # Move it 20 pixels left and 2 pixels down to keep it away from the corner
; tray-offset-x = -5
; tray-offset-y = 0
; tray-padding = 1

cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline= ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

scroll-up = i3wm-wsnext
scroll-down = i3wm-wsprev

[module/date]
type = internal/date
interval = 1
date = "%d - %H:%M"
label = %date%
label-foreground = ${colors.primary}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = / %free%
label-mounted-foreground = ${colors.primary}

[module/battery]
type = custom/script
exec = ~/.dotfiles/i3/.config/i3blocks/for_polybar/battery/battery_info.sh
interval = 2
label = %output%

[module/cpu-temperature]
type = custom/script
exec = ~/.config/i3blocks/for_polybar/cpu/cpu_info.sh
interval = 2
label = %output%
label-foreground = ${colors.primary}

[module/memory]
type = custom/script
exec = free -m | awk '/Mem:/ {printf "%.1fG/%.1fG", ($2-$7)/1024, $2/1024}'
interval = 3

# Prefix styled in Blue
format-prefix = "MEM: "
format-prefix-foreground = ${colors.success}

# Text styled in Blue
label-foreground = ${colors.primary}
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL: %percentage%%
label-volume-foreground = ${colors.success}

label-muted = VOL: %percentage%%
label-muted-foreground = ${colors.secondary}

[module/capslock]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

label-layout = 
label-layout-foreground = ${colors.primary}

label-indicator-on-capslock = "CAPS ON"
; Using Blue background for the indicator block to match the text theme
label-indicator-on-capslock-foreground = ${colors.background}
label-indicator-on-capslock-background = ${colors.primary}
label-indicator-on-capslock-padding = 1
label-indicator-on-capslock-margin = 0

label-indicator-off-capslock =

; for polybar >= 3.7.0 
[module/tray]
type = internal/tray
tray-spacing = 10px
tray-size = 60%  ; Adjust this to make icons fit nicely

[settings]
screenchange-reload = true

