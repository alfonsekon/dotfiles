capslock = swap(main_nav)
# capslock = overload(shift, swap(main_nav))

[main_nav]
h = left
j = down
k = up
l = right
w = C-right
b = C-left
u = C-z
r = C-y
d = C-x
y = C-c
p = C-v
x = backspace
( = home
) = end
[ = pageup
