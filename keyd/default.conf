# do not stow to home dir, stow to /etc/keyd
[ids]

*

[main]
# hold space - homerow becomes vim navigation
# (while holding space):
# press capslock - toggle between navigation and numbers/symbols
capslock = esc
rightshift = layer(symbols)
leftalt = overload(alt, oneshot(toggle_space_mode))
rightalt = overload(alt, capslock)
space = overloadt(main_nav, space, 190)
esc = timeout(layer(change_layout), 80, esc)

[toggle_space_mode]
leftalt = overload(alt, toggle(space_mode))

[change_layout]
1 = toggle(normal)
2 = toggle(colemak)

[normal]
capslock = capslock
rightshift = rightshift
leftshift = leftshift
space = space
rightalt = rightalt
leftalt = leftalt

# esc = overload(reset, esc)
esc = timeout(layer(reset), 100, esc)

[colemak]
w = w
, = ,
s = r
a = a
c = c
g = d
q = q
e = f
] = ]
d = s
/ = /
; = o
' = '
r = p
f = t
t = g
u = l
. = .
j = n
k = e
p = ;
o = y
z = z
h = h
i = u
[ = [
v = v
l = i
m = m
n = k
x = x
b = b
y = j
space = overloadt(colemak_nav, space, 190)

[space_mode]
space = space 

[symbols:S]
capslock = capslock

[main_numbers]
