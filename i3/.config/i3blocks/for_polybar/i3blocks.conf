[TIME_DATE]
command=date +" %a, %d %b - %H:%M:%S "
interval=1
color=#CB9592

[DISK]
command=df -h / | awk '/\//{ printf("%4s/%s \n", $4, $2) }'
interval=2
color=#CB9592

[BATTERY]
command=~/.config/i3blocks/battery/battery_info.sh
interval=5
color=#CB9592

[CPU]
full_text= CPU:  0.00% @ +00.0°C 
command=~/.config/i3blocks/cpu/cpu_info.sh
interval=repeat
color=#CB9592

[MEM]
command=free -m | awk '/Mem:/ {printf " MEM: %.1fG/%.1fG ", ($2-$7)/1024, $2/1024}'
interval=3
color=#CB9592

[SOUND_BURST]
command=~/.config/i3blocks/sound/sound_burst.sh
interval=once
color=#CB9592

[SOUND]
full_text= 🔇:  0% 
command=~/.config/i3blocks/sound/sound_info.sh
interval=0
signal=1
color=#CB9592
